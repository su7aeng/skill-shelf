# 매주 월요일 GitHub를 다시 수집해 data/ 를 갱신하고 커밋한다.
# 커밋이 올라가면 Vercel/Netlify가 자동으로 다시 배포한다 → 트렌딩, 새 스킬, RSS가 갱신됨.
name: weekly-crawl
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch: {}
permissions:
  contents: write
  discussions: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore crawl cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-
      - name: Crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl.mjs --refresh
      - name: Install
        run: npm ci
      - name: Community counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/community.mjs
      # AI 한국어 정리는 비용이 들어서 기본으로 꺼져 있다.
      # 켜려면: 저장소 Settings > Secrets 에 ANTHROPIC_API_KEY, Variables 에 AI_ENRICH=true
      - name: AI enrich (new skills only)
        if: ${{ vars.AI_ENRICH == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/enrich.mjs --only-new --limit ${{ vars.AI_ENRICH_LIMIT || 2000 }}
      - name: Check build
        run: node build.mjs
      - name: Commit
        run: |
          git config user.name "skill-shelf-bot"
          git config user.email "skill-shelf-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: 주간 수집 $(date -u +%F)"
          git push
